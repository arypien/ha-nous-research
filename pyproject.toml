[project]
name = "ha-nous-research"
version = "0.1.0"
description = "Home Assistant integration for the Nous Research inference API"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "D203", "D213", "EM101", "EM102", "TRY003", "TRY400", "PLR0913", "COM812", "ISC001", "FBT003", "S101", "INP001", "T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
